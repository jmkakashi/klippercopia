[force_move]
enable_force_move: true
[gcode_macro _LDC_CALIBRATE_DRIVE_CURRENT]
gcode:
    BED_MESH_CLEAR
    SET_KINEMATIC_POSITION x=100 y=100 z=10
    G28 X Y
    M104 S0
    M140 S0
    M106 S0
    G0 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    G0 Z30 F600
    G4 P1000
    LDC_CALIBRATE_DRIVE_CURRENT CHIP=fly_eddy_probe
    G4 P1000
    SAVE_CONFIG

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
    BED_MESH_CLEAR
    G28 X Y
    M104 S0
    M140 S0
    M106 S0
    G90
    G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 }
    {% endif %}
    PROBE_EDDY_CURRENT_CALIBRATE {rawparams}


[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
[include mainsail.cfg]

#[include stealthburner_leds.cfg]

[mcu]
serial = /dev/serial/by-id/usb-Klipper_stm32f446xx_370020000651343437373238-if00

[mcu SHT36]
canbus_uuid = bf026a044052

[safe_z_home]
home_xy_position = 150, 150
speed = 200
z_hop = 10
z_hop_speed = 100

[bed_mesh]
speed = 120
horizontal_move_z = 3
mesh_min = 40, 40
mesh_max = 250,250
fade_start = 0.6
fade_end = 10.0
probe_count = 5,5
algorithm = bicubic

[exclude_object]

[printer]
kinematics = corexy
max_velocity = 300
max_accel = 3000
max_z_velocity = 20
max_z_accel = 80
square_corner_velocity = 300

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  Connected to X on mcu_xye (B Motor)
[stepper_x]
step_pin = PF13
dir_pin = PF12
enable_pin = !PF14
rotation_distance = 40
microsteps = 16
full_steps_per_rotation = 200
endstop_pin = ^SHT36:gpio22
position_min = 0
position_endstop = 295
position_max = 300
homing_speed = 150
homing_retract_dist = 5
homing_positive_dir = true

[tmc2209 stepper_x]
uart_pin = PC4
interpolate = true
run_current = 0.8
sense_resistor = 0.110
stealthchop_threshold = 0

##  Connected to Y on mcu_xye (A Motor)
[stepper_y]
step_pin = PG0
dir_pin = !PG1
enable_pin = !PF15
rotation_distance = 40
microsteps = 16
full_steps_per_rotation = 200
endstop_pin = PG6
position_min = 0
position_endstop = 314
position_max = 314
homing_speed = 150
homing_retract_dist = 5
homing_positive_dir = true

[tmc2209 stepper_y]
uart_pin = PD11
interpolate = true
run_current = 0.8
sense_resistor = 0.110
stealthchop_threshold = 0
#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin = PF11
dir_pin = PG3
enable_pin = !PG5
rotation_distance = 50
gear_ratio = 80:16
microsteps = 16
endstop_pin = probe:z_virtual_endstop
position_min = -5
position_max = 290
homing_speed = 150
second_homing_speed = 3
homing_retract_dist = 0

[tmc2209 stepper_z]
uart_pin = PC6
interpolate = true
run_current = 0.8
sense_resistor = 0.110
stealthchop_threshold = 999999

[stepper_z1]
step_pin = PG4
dir_pin = !PC1
enable_pin = !PA0
rotation_distance = 50
gear_ratio = 80:16
microsteps = 16

[tmc2209 stepper_z1]
uart_pin = PC7
interpolate = true
run_current = 0.8
sense_resistor = 0.110
stealthchop_threshold = 999999

[stepper_z2]
step_pin = PF9
dir_pin = !PF10
enable_pin = !PG2
rotation_distance = 50
gear_ratio = 80:16
microsteps = 16

[tmc2209 stepper_z2]
uart_pin = PF2
interpolate = true
run_current = 0.8
sense_resistor = 0.110
stealthchop_threshold = 999999

[stepper_z3]
step_pin = PC13
dir_pin = PF0
enable_pin = !PF1
rotation_distance = 50
gear_ratio = 80:16
microsteps = 16

[tmc2209 stepper_z3]
uart_pin = PE4
interpolate = true
run_current = 0.8
sense_resistor = 0.110
stealthchop_threshold = 999999


#####################################################################
#   Extruder
#####################################################################
[extruder]
step_pin = SHT36:gpio7
dir_pin = SHT36:gpio6
enable_pin = !SHT36:gpio14
rotation_distance = 22.4809
gear_ratio = 50:10
microsteps = 16
sensor_type = ATC Semitec 104GT-2
sensor_pin = SHT36:gpio27
full_steps_per_rotation = 400
nozzle_diameter = 0.400
filament_diameter = 1.75
heater_pin = SHT36:gpio23
min_temp = -235
max_temp = 350
max_power = 1.0
min_extrude_temp = 170
pressure_advance = 0.05
pressure_advance_smooth_time = 0.040
max_extrude_only_distance = 800
max_extrude_cross_section = 800

[tmc2209 extruder]
uart_pin = SHT36:gpio15
interpolate = False
run_current = 0.6
sense_resistor = 0.110

[verify_heater extruder]
max_error = 20
check_gain_time = 120
hysteresis = 50
heating_gain = 2


#####################################################################
#   CALENTADOR DE CAMA
#####################################################################

[heater_bed]
heater_pin = PA3
sensor_type = EPCOS 100K B57560G104F
sensor_pin = PF3
max_power = 0.99
min_temp = 0
max_temp = 120


#####################################################################
##Ejecutar para modo automatico##
#SHAPER_CALIBRATE AXIS=X
#SHAPER_CALIBRATE AXIS=Y

[output_pin led_blanco]
pin = PD14
value = 1
shutdown_value = 0




#####################################################################
#   Fan Control
#####################################################################

##  VENTILADOR DEL HOTEND
[heater_fan hotend_fan]
pin = SHT36:gpio13
heater = extruder
heater_temp = 50.0

## VENTILADOR DE CAPA
[fan]
pin = SHT36:gpio21
#kick_start_time: 0.5
#off_below: 0.10

##  VENTILADOR DE LA ELECTRONICA
[heater_fan exhaust_fan]
pin = PD15
shutdown_speed = 0.0
kick_start_time = 5.0
heater = extruder
heater_temp = 20
fan_speed = 0.8


######################################################################
# EDDY SHT36
######################################################################

[temperature_sensor SHT36]
sensor_type = temperature_mcu
sensor_mcu = SHT36

[probe_eddy_current fly_eddy_probe]
sensor_type = ldc1612
i2c_address = 43
i2c_mcu = SHT36
i2c_bus = i2c1e
x_offset = 0
y_offset = 21.42
descend_z = 2.5
i2c_speed = 4000000
frequency = 40000000

[temperature_probe fly_eddy_probe]
sensor_type = Generic 3950
sensor_pin = SHT36:gpio28
#calibration_temp = 27.539122

[lis2dw]
cs_pin = SHT36:gpio12
spi_bus = spi0_gpio4_gpio3_gpio2

[resonance_tester]
accel_chip = lis2dw
probe_points = 150, 150, 20
min_freq = 5
max_freq = 133
accel_per_hz = 75
hz_per_sec = 1

[gcode_macro BED_MESH_CALIBRATE]
rename_existing = _BED_MESH_CALIBRATE
gcode = 
	{% set PROBE_Z_OFFSET = printer.configfile.settings['probe_eddy_current fly_eddy_probe'].descend_z|float %}
	{% set TARGET_TEMP = printer.heater_bed.target %}
	M140 S0
	_BED_MESH_CALIBRATE horizontal_move_z={PROBE_Z_OFFSET} METHOD=rapid_scan {rawparams}
	M140 S{TARGET_TEMP}



#####################################################################
# APAGADO AUTOMATICO
#####################################################################

[output_pin PS_ON_OFF]
pin: PG14
pwm: False
value: 1

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout = 121800

[quad_gantry_level]
gantry_corners = 
	-60,-10
	360, 370
points = 
	20,20
	20,240
	265,240
	265,20
speed = 150
horizontal_move_z = 10
retries = 5
retry_tolerance = 0.09
max_adjust = 10

########################################################################
#   SENSOR FILAMENTO
########################################################################

#[filament_switch_sensor Filamento Extrusor]
#pause_on_runout: False
#runout_gcode: PAUSE
#insert_gcode: RESUME
#switch_pin: 

#####################################################################
#   Macros
#####################################################################
[gcode_macro LOAD_FILAMENT]
variable_load_distance:  80
variable_purge_distance:  30
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{100} F{300} # fast-load
    G1 E{30} F{150} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  80
variable_purge_distance:  30
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    #G1 E{20} F{150} # purge
    G1 E-{80} F{300} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    {% if not 'xyz' in printer.toolhead.homed_axes %}
    STATUS_HOMING
    G28
    {% endif %}
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28
    G0 X150 Y150 Z20 F10000
    STATUS_READY
    
    
    [gcode_macro PIDCalibrate]
gcode:
    PID_CALIBRATE HEATER=extruder TARGET=210
    PID_CALIBRATE HEATER=heater_bed TARGET=70
    
[gcode_macro CLEAN_NOZZLE]
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
    {% if printer.extruder.temperature >= 200 %}
    M117 Cleaning nozzle
    G91
    G0 Z10 F10000
    SAVE_GCODE_STATE NAME=clean_nozzle
    G90
    G0 X290 Y308 F10000
    SAVE_GCODE_STATE NAME=clean_nozzle_above
    G0 Z1.4 F10000
    G0 X265 F10000
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    G0 Y305 X250
    G0 Y306 X290
    
    RESTORE_GCODE_STATE NAME=clean_nozzle_above MOVE=1
    M117 Cleaned!
    RESTORE_GCODE_STATE NAME=clean_nozzle MOVE=1
    G91
    G0 Z-10 F10000
    G90
    {% endif %}
    {% else %}
    { action_raise_error("Please home your axes!") }
    M117 Please home first!
    {% endif %}
    
[gcode_macro PRIME_NOZZLE]
gcode:
    {% set E = params.E|default(0.5) %} # retract size
    {% if not "xyz" in printer.toolhead.homed_axes %}
    { action_raise_error("Please home your axes!") }
    M117 Please home first!
    {% else %}
    {% if not printer.extruder.temperature >= 200 %}
    { action_raise_error("Heat up nozzle first!") }
    M117 Heat up nozzle first!
    {% else %}
    {% if not printer["filament_switch_sensor toolhead_sensor"].filament_detected %}
    G90
    G0 X200 Y305 F10000
    INJECT_FILAMENT
    CLEAN_NOZZLE
    {% endif %}
    {% endif %}
    {% endif %}
    

    
    
    ##################################################################
    # COMIENZO DE IMPRESION
    ##################################################################
[gcode_macro PRINT_START]
gcode:
    #STATUS_LEVELING
    G28		; home X Y Z
    G1 Z20 F3000            ; move nozzle away from bed
    QUAD_GANTRY_LEVEL
    #BED_MESH_CALIBRATE ADAPTIVE=1
    BED_MESH_CALIBRATE
     # PURGE_LINE
    #STATUS_CLEANING
    #CLEAN_NOZZLE
    STATUS_READY
    
    
    
    
    ####################################################################
    # FIN DE IMPRESION
    ####################################################################
[gcode_macro PRINT_END]
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5 F1800                   ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X125 Y250 F3600            ; park nozzle at rear
    #BED_MESH_CLEAR
    M109 S50
    SET_PIN PIN=PS_ON_OFF VALUE=0
    
    
    ####################################################################################################################

